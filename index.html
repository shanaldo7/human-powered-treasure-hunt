    <script>
      // Suppress Vite dev HMR websocket errors in cloud iframe environment per environment guidelines
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '') + ' ' + String(event.reason && event.reason.message ? event.reason.message : '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
    </script>
